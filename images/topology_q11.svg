<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="auto" style="background:#0f172a; border-radius:12px; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <!-- Gradients & Glows -->
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title / Legend -->
  <rect x="15" y="15" width="850" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="30" y="40" fill="#38bdf8" font-size="14" font-weight="bold">TOPOLOGY EXHIBIT: QUESTION 11 (LONGEST PREFIX MATCH)</text>
  <text x="730" y="40" fill="#94a3b8" font-size="12">Dest IP: 10.227.150.193</text>

  <!-- Network Links -->
  <!-- Link PC Y to Router Y -->
  <line x1="120" y1="180" x2="320" y2="180" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6,4" />
  <rect x="170" y="165" width="100" height="22" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="220" y="180" fill="#38bdf8" font-size="11" text-anchor="middle">10.224.6.0/24</text>

  <!-- Link Router Y to Switch Bus -->
  <line x1="380" y1="180" x2="560" y2="180" stroke="#10b981" stroke-width="3" />
  <rect x="420" y="165" width="100" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="470" y="180" fill="#34d399" font-size="11" text-anchor="middle">10.224.1.0/24</text>

  <!-- Vertical Backbone / Shared Segment -->
  <line x1="560" y1="80" x2="560" y2="280" stroke="#10b981" stroke-width="4" />

  <!-- Branches to Routers A, B, C, D -->
  <line x1="560" y1="80" x2="700" y2="80" stroke="#10b981" stroke-width="2" />
  <line x1="560" y1="140" x2="700" y2="140" stroke="#10b981" stroke-width="2" />
  <line x1="560" y1="200" x2="700" y2="200" stroke="#10b981" stroke-width="2" />
  <line x1="560" y1="260" x2="700" y2="260" stroke="#10b981" stroke-width="2" />

  <!-- Device: PC Y -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="70" height="55" rx="8" fill="url(#pcGrad)" stroke="#64748b" stroke-width="2"/>
    <rect x="10" y="8" width="50" height="30" rx="3" fill="#0f172a" />
    <polygon points="12,32 58,32 54,35 16,35" fill="#38bdf8"/>
    <text x="35" y="73" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">PC Y</text>
    <text x="35" y="88" fill="#94a3b8" font-size="11" text-anchor="middle">10.224.6.3</text>
  </g>

  <!-- Device: Router Y -->
  <g transform="translate(320, 145)">
    <circle cx="35" cy="35" r="35" fill="url(#routerGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <!-- Router arrows icon -->
    <path d="M 20 28 L 50 28 M 45 23 L 50 28 L 45 33" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 50 42 L 20 42 M 25 37 L 20 42 L 25 47" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="35" y="90" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Router Y</text>
    <!-- Interface Labels -->
    <text x="-15" y="30" fill="#e2e8f0" font-size="11" font-weight="bold">G0/1: .6.1</text>
    <text x="85" y="30" fill="#e2e8f0" font-size="11" font-weight="bold">G0/0: .1.1</text>
  </g>

  <!-- Device: Router A -->
  <g transform="translate(700, 55)">
    <circle cx="25" cy="25" r="24" fill="url(#routerGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">R-A</text>
    <text x="60" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Router A</text>
    <text x="60" y="38" fill="#94a3b8" font-size="11">10.224.1.2</text>
  </g>

  <!-- Device: Router B -->
  <g transform="translate(700, 115)">
    <circle cx="25" cy="25" r="24" fill="url(#routerGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">R-B</text>
    <text x="60" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Router B</text>
    <text x="60" y="38" fill="#94a3b8" font-size="11">10.224.1.3</text>
  </g>

  <!-- Device: Router C -->
  <g transform="translate(700, 175)">
    <circle cx="25" cy="25" r="24" fill="url(#routerGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">R-C</text>
    <text x="60" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Router C</text>
    <text x="60" y="38" fill="#94a3b8" font-size="11">10.224.1.4</text>
  </g>

  <!-- Device: Router D (MATCH - HIGHLIGHTED) -->
  <g transform="translate(700, 235)">
    <circle cx="25" cy="25" r="26" fill="#059669" stroke="#34d399" stroke-width="2.5" filter="url(#glow)"/>
    <text x="25" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">R-D</text>
    <text x="60" y="22" fill="#34d399" font-size="13" font-weight="bold">Router D (Correct Next-Hop)</text>
    <text x="60" y="38" fill="#a7f3d0" font-size="11">10.224.1.5 (via OSPF 10.226.0.0/15)</text>
  </g>
</svg>